name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: 语法检查（Python ${{ matrix.python }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.10', '3.12' ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 编译检查全部 .py
        run: python -m compileall -q app.py detect.py package_release.py yolo_app tests

  models:
    name: 演示模型可用性
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验 ONNX 模型可加载
        run: |
          python -m pip install --upgrade pip
          python -m pip install "onnxruntime>=1.17,<2.0"
          python -c "import onnxruntime as ort; s = ort.InferenceSession('models/yolov8n.onnx', providers=['CPUExecutionProvider']); print('inputs:', [(i.name, i.shape) for i in s.get_inputs()]); print('outputs:', [(o.name, o.shape) for o in s.get_outputs()])"

      - name: 校验 PT 模型文件结构
        run: python -c "import zipfile, sys; ok = zipfile.is_zipfile('models/yolov8n.pt'); print('yolov8n.pt is a valid zip/torch archive:', ok); sys.exit(0 if ok else 1)"

  repo-hygiene:
    name: 仓库卫生检查
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认没有误提交构建产物或本机配置
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File -Force |
            Where-Object {
              $_.FullName -notmatch '\\\.git\\' -and
              ($_.FullName -match '\\(dist|build|release|\.venv|input|output)\\' -or
               $_.Name -in @('settings.json', '_tmp_settings_probe.json') -or
               $_.Extension -in @('.pyc', '.pyo', '.exe', '.zip'))
            } |
            Where-Object { $_.Extension -ne '.gitkeep' }
          if ($bad) {
            Write-Host "::error::发现不应入库的文件："
            $bad | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Write-Host "OK：未发现构建产物。"

      - name: 确认没有硬编码的个人绝对路径
        shell: pwsh
        run: |
          $hits = Select-String -Path (Get-ChildItem -Recurse -File -Include *.py,*.bat,*.md,*.txt,*.spec,*.iss,*.json |
                    Where-Object { $_.FullName -notmatch '\\\.git\\' }) -Pattern '[A-Za-z]:\\Users\\' -ErrorAction SilentlyContinue
          if ($hits) {
            Write-Host "::error::发现硬编码的个人路径："
            $hits | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }
          Write-Host "OK：未发现硬编码个人路径。"